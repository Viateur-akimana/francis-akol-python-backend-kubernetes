# Production Docker Compose

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mlh-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlh_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MULTIPLE_DATABASES: user_service_db,course_service_db,enrollment_service_db,payment_service_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlh_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - mlh-network

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: mlh-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - mlh-network

  # User Service
  user-service:
    image: ${REGISTRY:-ghcr.io/franakol}/mlh-user-service:${TAG:-latest}
    container_name: mlh-user-service-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mlh_admin}:${POSTGRES_PASSWORD}@postgres:5432/user_service_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlh-network

  # Course Service
  course-service:
    image: ${REGISTRY:-ghcr.io/franakol}/mlh-course-service:${TAG:-latest}
    container_name: mlh-course-service-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mlh_admin}:${POSTGRES_PASSWORD}@postgres:5432/course_service_db
      - REDIS_URL=redis://redis:6379/1
      - REDIS_CACHE_TTL=300
      - USER_SERVICE_URL=http://user-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlh-network

  # Enrollment Service
  enrollment-service:
    image: ${REGISTRY:-ghcr.io/franakol}/mlh-enrollment-service:${TAG:-latest}
    container_name: mlh-enrollment-service-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mlh_admin}:${POSTGRES_PASSWORD}@postgres:5432/enrollment_service_db
      - REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - USER_SERVICE_URL=http://user-service:8001
      - COURSE_SERVICE_URL=http://course-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlh-network

  # Payment Service
  payment-service:
    image: ${REGISTRY:-ghcr.io/franakol}/mlh-payment-service:${TAG:-latest}
    container_name: mlh-payment-service-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mlh_admin}:${POSTGRES_PASSWORD}@postgres:5432/payment_service_db
      - REDIS_URL=redis://redis:6379/4
      - USER_SERVICE_URL=http://user-service:8001
      - COURSE_SERVICE_URL=http://course-service:8002
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlh-network

  # Celery Worker
  celery-worker:
    image: ${REGISTRY:-ghcr.io/franakol}/mlh-enrollment-service:${TAG:-latest}
    container_name: mlh-celery-worker-prod
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mlh_admin}:${POSTGRES_PASSWORD}@postgres:5432/enrollment_service_db
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - COURSE_SERVICE_URL=http://course-service:8002
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlh-network

  # Celery Beat Scheduler
  celery-beat:
    image: ${REGISTRY:-ghcr.io/franakol}/mlh-enrollment-service:${TAG:-latest}
    container_name: mlh-celery-beat-prod
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlh-network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mlh-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - user-service
      - course-service
      - enrollment-service
      - payment-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlh-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mlh-network:
    driver: bridge
