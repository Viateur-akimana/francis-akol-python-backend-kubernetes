events {
    worker_connections 1024;
}

http {
    # Upstream services - using Railway internal networking
    upstream user_service {
        server user-service.railway.internal:8000;
    }

    upstream course_service {
        server course-service.railway.internal:8000;
    }

    upstream enrollment_service {
        server enrollment-service.railway.internal:8000;
    }

    upstream payment_service {
        server payment-service.railway.internal:8000;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 '{"status": "healthy", "gateway": "nginx"}';
            add_header Content-Type application/json;
        }

        # API Documentation - redirect to user-service docs
        location /docs {
            proxy_pass http://user_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service Routes
        location /api/v1/users {
            proxy_pass http://user_service/api/v1/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth {
            proxy_pass http://user_service/api/v1/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Course Service Routes
        location /api/v1/courses {
            proxy_pass http://course_service/api/v1/courses;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Enrollment Service Routes
        location /api/v1/enrollments {
            proxy_pass http://enrollment_service/api/v1/enrollments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payment Service Routes
        location /api/v1/payments {
            proxy_pass http://payment_service/api/v1/payments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stripe Webhook (needs special handling)
        location /api/v1/webhooks/stripe {
            proxy_pass http://payment_service/api/v1/webhooks/stripe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Don't buffer for webhooks
            proxy_buffering off;
        }

        # Root - API info
        location / {
            return 200 '{
                "name": "MLH Fellowship API Gateway",
                "version": "1.0.0",
                "endpoints": {
                    "users": "/api/v1/users",
                    "auth": "/api/v1/auth",
                    "courses": "/api/v1/courses",
                    "enrollments": "/api/v1/enrollments",
                    "payments": "/api/v1/payments"
                },
                "docs": "/docs",
                "health": "/health"
            }';
            add_header Content-Type application/json;
        }
    }
}
