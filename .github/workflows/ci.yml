name: CI Pipeline

on:
  push:
    branches: [ development, main, feature/*, fix/* ]
  pull_request:
    branches: [ development, main ]

jobs:
  detect-changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.filter.outputs.user_service }}
      course-service: ${{ steps.filter.outputs.course_service }}
      enrollment-service: ${{ steps.filter.outputs.enrollment_service }}
      payment_service: ${{ steps.filter.outputs.payment_service }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            user_service:
              - 'services/user-service/**'
            course_service:
              - 'services/course-service/**'
            enrollment_service:
              - 'services/enrollment-service/**'
            payment_service:
              - 'services/payment-service/**'

  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy pydantic sqlalchemy[asyncio] fastapi httpx celery redis
      - name: Run Quality Checks
        run: |
          black --check --diff services/
          isort --check-only --diff services/ --profile=black
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
          mypy services/ --ignore-missing-imports || true

  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-format]
    if: needs.detect-changes.outputs.user-service == 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./services/user-service
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run tests
        working-directory: ./services/user-service
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
        run: pytest tests/ -v --cov=app --cov-report=xml || true
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./services/user-service/coverage.xml
          flags: user-service
        continue-on-error: true

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-format]
    strategy:
      matrix:
        service: [user-service, course-service, enrollment-service, payment-service]
    if: |
      (matrix.service == 'user-service' && needs.detect-changes.outputs.user-service == 'true') ||
      (matrix.service == 'course-service' && needs.detect-changes.outputs.course-service == 'true') ||
      (matrix.service == 'enrollment-service' && needs.detect-changes.outputs.enrollment-service == 'true') ||
      (matrix.service == 'payment-service' && needs.detect-changes.outputs.payment-service == 'true')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./services/${{ matrix.service }}/Dockerfile
          ignore: DL3008,DL3013
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: mlh-${{ matrix.service }}:${{ github.sha }}
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mlh-${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Run Bandit
        run: |
          pip install bandit[toml]
          bandit -r services/ || true
      - name: Run Checkov
        run: |
          pip install checkov
          checkov -d terraform/ --quiet --soft-fail || true
      - name: Run Kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: k8s/
        continue-on-error: true

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: always() && (needs.build-docker-images.result == 'success' || needs.build-docker-images.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Start services with retry
        run: |
          for i in {1..3}; do
            if docker compose pull --quiet; then break; fi
            sleep 10
          done
          docker compose up -d postgres redis mongodb
          sleep 10
          docker compose up -d user-service course-service enrollment-service payment-service
          sleep 15
      - name: Run Newman
        run: |
          npm install -g newman newman-reporter-htmlextra
          newman run docs/api-specs/postman/MLH_Platform_API.postman_collection.json \
            --env-var "user_service_url=http://localhost:8001" \
            --reporters cli,htmlextra || true
      - name: Stop services
        if: always()
        run: docker compose down -v
