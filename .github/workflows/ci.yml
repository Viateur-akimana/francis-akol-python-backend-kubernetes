name: CI Pipeline

on:
  push:
    branches: [ development, main, feature/*, fix/* ]
  pull_request:
    branches: [ development, main ]

jobs:
  detect-changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    outputs:
      user_service: ${{ steps.filter.outputs.user_service }}
      course_service: ${{ steps.filter.outputs.course_service }}
      enrollment_service: ${{ steps.filter.outputs.enrollment_service }}
      payment_service: ${{ steps.filter.outputs.payment_service }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            user_service:
              - 'services/user-service/**'
            course_service:
              - 'services/course-service/**'
            enrollment_service:
              - 'services/enrollment-service/**'
            payment_service:
              - 'services/payment-service/**'

  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
      - name: Run Black
        run: black --check --diff services/
      - name: Run isort
        run: isort --check-only --diff services/ --profile=black
      - name: Run Flake8
        run: |
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-format]
    if: needs.detect-changes.outputs.user_service == 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./services/user-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run tests
        working-directory: ./services/user-service
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-only
        run: pytest tests/ -v --cov=app --cov-report=xml || true

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-format]
    strategy:
      matrix:
        service: [user-service, course-service, enrollment-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - name: Conditional Check
        id: check
        run: |
          SERVICE_NAME=$(echo "${{ matrix.service }}" | sed 's/-/_/g')
          HAS_CHANGES=$(echo "${{ needs.detect-changes.outputs.$SERVICE_NAME }}")
          if [[ "$HAS_CHANGES" != "true" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: mlh-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install bandit[toml] checkov
      - name: Scan IaC
        run: checkov -d terraform/ --quiet --soft-fail || true

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
      - uses: actions/checkout@v4
      - name: Start services with retry
        run: |
          for i in {1..3}; do
            if docker compose pull --quiet; then break; fi
            sleep 10
          done
          docker compose up -d postgres redis mongodb
          sleep 10
          docker compose up -d user-service course-service enrollment-service payment-service
          sleep 15
      - name: Stop services
        if: always()
        run: docker compose down -v
