name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [user-service, course-service, enrollment-service, payment-service]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v5
      with:
        context: ./services/${{ matrix.service }}
        file: ./services/${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  terraform-infra:
    name: Provision Infrastructure (Terraform)
    runs-on: ubuntu-latest
    # Run on main for staging, or on dispatch for specific env
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }} # No hardcoded password
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ENV_NAME: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging' || 'production') }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Terraform Init
      run: |
        # Use environment specific directory
        # In production, we'd use 'prod', and 'staging' otherwise
        if [ "${{ env.ENV_NAME }}" == "production" ]; then
          TARGET_DIR="terraform/environments/prod"
        else
          TARGET_DIR="terraform/environments/staging"
        fi
        cd $TARGET_DIR
        terraform init # Now connects to the real S3 backend if configured

    - name: Terraform Plan & Apply (Restricted to Staging in Demo)
      run: |
        if [ "${{ env.ENV_NAME }}" == "production" ]; then
          TARGET_DIR="terraform/environments/prod"
          echo "⚠️ Production deployment requires manual gate/approval in a real scenario."
        else
          TARGET_DIR="terraform/environments/staging"
        fi
        
        cd $TARGET_DIR
        terraform plan -out=tfplan
        
        # Only Apply automatically for Staging; Production requires human eyes
        if [ "${{ env.ENV_NAME }}" == "production" ]; then
           echo "Provisioning Production infrastructure skip for safety..."
        else
           # terraform apply -auto-approve tfplan  # Commented out for security until ready
           echo "Infrastructure planned: ${{ env.ENV_NAME }}"
        fi

  deploy-apps:
    name: Sync ArgoCD Applications
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform-infra]
    
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

    steps:
    - name: Install ArgoCD CLI
      run: |
        curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        chmod +x argocd-linux-amd64
        sudo mv argocd-linux-amd64 /usr/local/bin/argocd

    - name: Trigger ArgoCD Sync
      run: |
        # Use the CLI to trigger an immediate sync of labels
        # This ensuring that the cluster state matches the git state instantly
        argocd app sync -l app.kubernetes.io/part-of=modular-learning-hub --server ${{ env.ARGOCD_SERVER }} --auth-token ${{ env.ARGOCD_AUTH_TOKEN }} --grpc-web --insecure
