apiVersion: v1
kind: Secret
metadata:
  name: mlh-secrets
  namespace: mlh-platform
  labels:
    app.kubernetes.io/part-of: modular-learning-hub
type: Opaque
stringData:
  # JWT Secret (change in production!)
  JWT_SECRET_KEY: "your-super-secret-jwt-key-change-this-in-production-min-32-chars"
  
  # Database URLs (Updated for RDS)
  USER_DATABASE_URL: "postgresql+asyncpg://postgres:mlh_secure_password@RDS_ENDPOINT:5432/user_service_db"
  COURSE_DATABASE_URL: "postgresql+asyncpg://postgres:mlh_secure_password@RDS_ENDPOINT:5432/course_service_db"
  ENROLLMENT_DATABASE_URL: "postgresql+asyncpg://postgres:mlh_secure_password@RDS_ENDPOINT:5432/enrollment_service_db"
  PAYMENT_DATABASE_URL: "postgresql+asyncpg://postgres:mlh_secure_password@RDS_ENDPOINT:5432/payment_service_db"
  
  # PostgreSQL
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "mlh_secure_password_change_me"
  
  # MongoDB
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "mlh_mongo_password_change_me"
  
  # Redis
  REDIS_PASSWORD: "mlh_redis_password_change_me"
