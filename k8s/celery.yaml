apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: mlh-platform
  labels:
    app: celery-worker
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/part-of: modular-learning-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: mlh-enrollment-service:latest
        imagePullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mlh-secrets
              key: ENROLLMENT_DATABASE_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: CELERY_RESULT_BACKEND
        - name: COURSE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: COURSE_SERVICE_URL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: mlh-platform
  labels:
    app: celery-beat
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/part-of: modular-learning-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: mlh-enrollment-service:latest
        imagePullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.core.celery_app", "beat", "--loglevel=info"]
        env:
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: CELERY_RESULT_BACKEND
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
