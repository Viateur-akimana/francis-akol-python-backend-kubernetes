apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: mlh-platform
  labels:
    app: course-service
    app.kubernetes.io/name: course-service
    app.kubernetes.io/part-of: modular-learning-hub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
      - name: course-service
        image: mlh-course-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mlh-secrets
              key: COURSE_DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: REDIS_URL
        - name: REDIS_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: REDIS_CACHE_TTL
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: USER_SERVICE_URL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mlh-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: mlh-platform
  labels:
    app: course-service
spec:
  type: ClusterIP
  selector:
    app: course-service
  ports:
  - port: 80
    targetPort: 8002
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: course-service-hpa
  namespace: mlh-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: course-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
