apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlh-ingress
  namespace: mlh-platform
  labels:
    app.kubernetes.io/part-of: modular-learning-hub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.mlh.example.com
    secretName: mlh-tls-secret
  rules:
  - host: api.mlh.example.com
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80
      - path: /api/v1/courses
        pathType: Prefix
        backend:
          service:
            name: course-service
            port:
              number: 80
      - path: /api/v1/categories
        pathType: Prefix
        backend:
          service:
            name: course-service
            port:
              number: 80
      - path: /api/v1/enrollments
        pathType: Prefix
        backend:
          service:
            name: enrollment-service
            port:
              number: 80
      - path: /api/v1/payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 80
